services:
  api:
    ports: !reset []
    restart: unless-stopped
    # Chromium (website capture, site agent, slide render check) needs more than Docker's 64 MB /dev/shm.
    shm_size: "2gb"
    environment:
      CORS_ORIGIN: https://${PUBLIC_HOST:?Set PUBLIC_HOST}
      TRACE_LOGS: "1"
      COPITCH_TRUST_GATEWAY: "1"
      SITE_AGENT_ALLOW_PRIVATE: "0"
    volumes:
      - ${SESSION_DATA_DIR:?Set SESSION_DATA_DIR on mounted EBS}:/data
  voice:
    restart: unless-stopped
  web:
    ports: !reset []
    restart: unless-stopped
    build:
      args:
        NEXT_PUBLIC_API_URL: ""
    environment:
      NEXT_PUBLIC_API_URL: ""
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - web
volumes:
  caddy-data:
