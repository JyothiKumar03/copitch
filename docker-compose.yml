services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3001:3001"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TEXT_MODELS: ${OPENAI_TEXT_MODELS:-[]}
      VOICE_WORKER_TOKEN: ${VOICE_WORKER_TOKEN:-}
      VOICE_WORKER_URL: http://voice:8900
      AI_SESSION_DB: /data/sessions.sqlite
      PORT: 3001
      CORS_ORIGIN: http://localhost:3000
      DECK_RENDER_ORIGIN: http://web:3000
      MISSION_BUDGET_USD: ${MISSION_BUDGET_USD:-5}
      SITE_RUN_BUDGET_USD: ${SITE_RUN_BUDGET_USD:-5}
    volumes:
      - session-data:/data
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://localhost:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5

  voice:
    build:
      context: .
      dockerfile: voice/Dockerfile
    environment:
      VOICE_WORKER_TOKEN: ${VOICE_WORKER_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe}
      OPENAI_SPEECH_MODEL: ${OPENAI_SPEECH_MODEL:-gpt-4o-mini-tts}
      OPENAI_LIVE_MODEL: ${OPENAI_LIVE_MODEL:-gpt-live-1.1}
      OPENAI_SPEECH_VOICE: ${OPENAI_SPEECH_VOICE:-marin}

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    environment:
      WEB_PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      api:
        condition: service_healthy

volumes:
  session-data:
