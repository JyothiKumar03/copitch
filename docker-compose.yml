services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3001:3001"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TEXT_MODELS: ${OPENAI_TEXT_MODELS:-[]}
      AI_SESSION_DB: /data/sessions.sqlite
      PORT: 3001
      CORS_ORIGIN: http://localhost:3000
    volumes:
      - session-data:/data
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://localhost:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    environment:
      WEB_PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      api:
        condition: service_healthy

volumes:
  session-data:
